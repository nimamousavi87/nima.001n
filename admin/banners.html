

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090909">
  <title>مدیریت بنرها | NIMA.001N</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:Tahoma,Arial,sans-serif;background:#090909;color:#f5f5f5;min-height:100vh}
    button,input,textarea,select{font:inherit}
    .topbar{padding:20px 5%;background:#111;border-bottom:1px solid #252525;display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}
    .brand{font-size:20px;font-weight:bold;letter-spacing:1px}
    .brand span{color:#ff3030}
    .back{color:#fff;text-decoration:none;border:1px solid #383838;padding:10px 15px;border-radius:10px;font-size:13px}
    .back:hover{border-color:#ff3030}
    .container{width:92%;max-width:1150px;margin:35px auto}
    .heading{margin-bottom:25px}
    .heading h1{font-size:26px;margin-bottom:10px}
    .heading p{color:#888;font-size:13px;line-height:2}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:25px}
    .stat,.panel{background:#111;border:1px solid #292929;border-radius:15px;padding:20px}
    .stat small{color:#888}
    .stat strong{display:block;font-size:27px;margin-top:12px;color:#ff3434}
    .panel{border-radius:17px;margin-bottom:25px}
    .panel h2{font-size:18px;margin-bottom:20px}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
    .field{display:flex;flex-direction:column;gap:9px}
    .field.full{grid-column:1/-1}
    label{font-size:13px;color:#bbb}
    input,textarea,select{width:100%;background:#090909;border:1px solid #333;color:white;border-radius:10px;padding:13px;outline:none}
    input:focus,textarea:focus,select:focus{border-color:#ff3434}
    textarea{resize:vertical;min-height:90px;line-height:2}
    input[type=file]{padding:10px}
    input[type=checkbox]{width:auto;accent-color:#ff3434}
    .hint{color:#777;font-size:11px;line-height:1.9}
    .checks{display:flex;gap:22px;flex-wrap:wrap;margin-top:18px}
    .check{display:flex;align-items:center;gap:8px;font-size:13px;color:#ccc}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
    .btn{border:0;padding:12px 20px;border-radius:10px;cursor:pointer;font-weight:bold;font-size:13px}
    .primary{background:#ff3030;color:white}
    .primary:hover{background:#d91e1e}
    .secondary{background:#292929;color:white}
    .danger{background:#351515;color:#ff7777}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .toolbar{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:18px}
    .toolbar input{max-width:350px}
    .items{display:grid;gap:13px}
    .item{background:#0b0b0b;border:1px solid #292929;border-radius:13px;padding:15px;display:flex;align-items:center;gap:15px;flex-wrap:wrap}
    .preview{width:125px;height:85px;flex-shrink:0;background:#181818;border-radius:9px;overflow:hidden;display:grid;place-items:center;color:#777;font-size:12px}
    .preview img,.preview video{width:100%;height:100%;object-fit:cover}
    .item-info{flex:1;min-width:180px}
    .item-info h3{font-size:15px;margin-bottom:8px}
    .item-info p{color:#888;font-size:12px;line-height:1.9}
    .status{display:inline-block;font-size:11px;padding:6px 10px;border-radius:20px;margin-top:8px}
    .active{background:#12321e;color:#73e99a}
    .inactive{background:#332716;color:#ffc56b}
    .item-actions{display:flex;gap:8px;flex-wrap:wrap}
    .item-actions button{padding:9px 12px;font-size:12px}
    .empty{text-align:center;color:#888;padding:35px 10px;border:1px dashed #333;border-radius:12px;line-height:2}
    .message{display:none;padding:13px;border-radius:10px;margin-bottom:15px;font-size:13px;line-height:1.8}
    .message.error{display:block;background:#351515;color:#ff9999}
    .message.success{display:block;background:#12321e;color:#8df0ad}
    .hidden{display:none!important}
    .file-preview{margin-top:12px;max-width:100%;max-height:240px;border-radius:12px;display:none;background:#080808}
    .file-preview img,.file-preview video{max-width:100%;max-height:240px;border-radius:12px}
    @media(max-width:650px){
      .stats,.form-grid{grid-template-columns:1fr}
      .field.full{grid-column:auto}
      .heading h1{font-size:22px}
      .item-actions{width:100%}
      .item-actions button{flex:1}
      .preview{width:100%;height:150px}
    }
  </style>
</head>
<body>

<header class="topbar">
  <div class="brand">NIMA<span>.001N</span></div>
  <a href="index.html" class="back">← بازگشت به پنل مدیریت</a>
</header>

<main class="container">
  <div class="heading">
    <h1>مدیریت بنرها و تصاویر</h1>
    <p>آپلود، زمان‌بندی، ویرایش و مدیریت رسانه‌های صفحات سایت.</p>
  </div>

  <div id="message" class="message" role="status"></div>

  <section class="stats">
    <div class="stat"><small>کل رسانه‌ها</small><strong id="totalCount">۰</strong></div>
    <div class="stat"><small>فعال</small><strong id="activeCount">۰</strong></div>
    <div class="stat"><small>غیرفعال</small><strong id="inactiveCount">۰</strong></div>
  </section>

  <section class="panel" id="editorPanel">
    <h2 id="formTitle">✦ افزودن بنر جدید</h2>

    <form id="bannerForm">
      <div class="form-grid">

        <div class="field full">
          <label for="title">عنوان بنر *</label>
          <input id="title" required maxlength="180" placeholder="عنوان بنر">
        </div>

        <div class="field full">
          <label for="description">توضیحات</label>
          <textarea id="description" placeholder="توضیحات اختیاری"></textarea>
        </div>

        <div class="field">
          <label for="page">محل نمایش</label>
          <select id="page">
            <option value="home">صفحه اصلی</option>
            <option value="vpn">صفحه VPN</option>
            <option value="blog">آموزش‌ها</option>
            <option value="projects">پروژه‌ها</option>
            <option value="contact">تماس با ما</option>
            <option value="all">تمام صفحات</option>
          </select>
        </div>

        <div class="field">
          <label for="displayType">نوع نمایش</label>
          <select id="displayType">
            <option value="single">نمایش تکی</option>
            <option value="slider">اسلایدشو</option>
          </select>
        </div>

        <div class="field full">
          <label for="mediaFile">انتخاب فایل از گوشی *</label>
          <input id="mediaFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm">
          <span class="hint">فرمت‌های مجاز: JPG، PNG، WebP، GIF، MP4 و WebM — حداکثر ۵۰ مگابایت</span>
          <div id="filePreview" class="file-preview"></div>
        </div>

        <div class="field full">
          <label for="clickUrl">لینک مقصد با کلیک روی بنر</label>
          <input id="clickUrl" type="url" placeholder="https://example.com">
        </div>

        <div class="field">
          <label for="sortOrder">ترتیب نمایش</label>
          <input id="sortOrder" type="number" value="0">
        </div>

        <div class="field">
          <label for="slideInterval">فاصله اسلایدها (میلی‌ثانیه)</label>
          <input id="slideInterval" type="number" min="2000" max="30000" step="500" value="5000">
        </div>

        <div class="field">
          <label for="startsAt">شروع نمایش</label>
          <input id="startsAt" type="datetime-local">
        </div>

        <div class="field">
          <label for="endsAt">پایان نمایش</label>
          <input id="endsAt" type="datetime-local">
        </div>
      </div>

      <div class="checks">
        <label class="check">
          <input type="checkbox" id="isActive" checked>
          فعال‌سازی بنر
        </label>
      </div>

      <div class="actions">
        <button type="submit" class="btn primary" id="saveBtn">ذخیره بنر</button>
        <button type="button" class="btn secondary hidden" id="cancelBtn">لغو ویرایش</button>
      </div>
    </form>
  </section>

  <section class="panel">
    <div class="toolbar">
      <h2>▧ فهرست بنرها</h2>
      <input id="searchInput" placeholder="جستجوی بنر...">
    </div>
    <div id="bannersList" class="items">
      <div class="empty">در حال دریافت اطلاعات...</div>
    </div>
  </section>
</main>

<script type="module">
  import { supabase } from "./supabase.js";

  const $ = id => document.getElementById(id);
  const form = $("bannerForm");
  const list = $("bannersList");
  const saveBtn = $("saveBtn");
  const message = $("message");

  let banners = [];
  let editingId = null;
  let existingFileUrl = "";
  let previewObjectUrl = "";

  function showMessage(text, type = "success") {
    message.textContent = text;
    message.className = "message " + type;
    window.scrollTo({top:0,behavior:"smooth"});
    setTimeout(() => message.className = "message", 4500);
  }

  function escapeHTML(value = "") {
    return String(value).replace(/[&<>"']/g, c => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
    })[c]);
  }

  function isAdminError(error) {
    return error?.code === "PGRST116" || /permission|policy|row-level/i.test(error?.message || "");
  }

  async function checkAdmin() {
    const {data:{session},error} = await supabase.auth.getSession();
    if(error || !session) {
      location.href = "index.html";
      return false;
    }

    const {data,error:adminError} = await supabase
      .from("admin_users")
      .select("user_id")
      .eq("user_id",session.user.id)
      .maybeSingle();

    if(adminError || !data) {
      alert("دسترسی مدیریت برای این حساب تأیید نشد.");
      location.href = "index.html";
      return false;
    }
    return true;
  }

  function updateStats() {
    $("totalCount").textContent = banners.length;
    $("activeCount").textContent = banners.filter(b => b.is_active).length;
    $("inactiveCount").textContent = banners.filter(b => !b.is_active).length;
  }

  function mediaMarkup(url,type) {
    const safe = escapeHTML(url);
    if(type === "video") {
      return `<video src="${safe}" muted playsinline controls></video>`;
    }
    return `<img src="${safe}" alt="پیش‌نمایش رسانه" loading="lazy">`;
  }

  async function loadBanners() {
    list.innerHTML = '<div class="empty">در حال دریافت اطلاعات...</div>';

    const {data,error} = await supabase
      .from("site_banners")
      .select("*")
      .order("sort_order",{ascending:true})
      .order("created_at",{ascending:false});

    if(error) {
      list.innerHTML = '<div class="empty">خطا در دریافت: '+escapeHTML(error.message)+'</div>';
      showMessage("دریافت بنرها ناموفق بود: "+error.message,"error");
      return;
    }

    banners = data || [];
    updateStats();
    renderBanners();
  }

  function renderBanners() {
    const search = $("searchInput").value.trim().toLowerCase();
    const filtered = banners.filter(b =>
      (b.title || "").toLowerCase().includes(search) ||
      (b.page || "").toLowerCase().includes(search)
    );

    if(!filtered.length) {
      list.innerHTML = '<div class="empty">هنوز بنری ثبت نشده است.</div>';
      return;
    }

    list.innerHTML = filtered.map(b => `
      <article class="item">
        <div class="preview">${mediaMarkup(b.file_url,b.media_type)}</div>
        <div class="item-info">
          <h3>${escapeHTML(b.title)}</h3>
          <p>
            صفحه: ${escapeHTML(b.page)} ·
            نوع: ${b.display_type === "slider" ? "اسلایدشو" : "تکی"} ·
            رسانه: ${escapeHTML(b.media_type)}
          </p>
          <span class="status ${b.is_active ? "active" : "inactive"}">
            ${b.is_active ? "فعال" : "غیرفعال"}
          </span>
        </div>
        <div class="item-actions">
          <button class="btn secondary" data-action="edit" data-id="${b.id}">ویرایش</button>
          <button class="btn secondary" data-action="toggle" data-id="${b.id}">${b.is_active ? "غیرفعال‌کردن" : "فعال‌کردن"}</button>
          <button class="btn danger" data-action="delete" data-id="${b.id}">حذف</button>
        </div>
      </article>
    `).join("");
  }

  function resetForm() {
    form.reset();
    editingId = null;
    existingFileUrl = "";
    $("sortOrder").value = 0;
    $("slideInterval").value = 5000;
    $("isActive").checked = true;
    $("formTitle").textContent = "✦ افزودن بنر جدید";
    saveBtn.textContent = "ذخیره بنر";
    $("cancelBtn").classList.add("hidden");
    $("mediaFile").required = true;
    $("filePreview").style.display = "none";
    $("filePreview").innerHTML = "";
    if(previewObjectUrl) URL.revokeObjectURL(previewObjectUrl);
    previewObjectUrl = "";
  }

  function editBanner(id) {
    const b = banners.find(x => x.id === id);
    if(!b) return;

    editingId = id;
    existingFileUrl = b.file_url;

    $("title").value = b.title || "";
    $("description").value = b.description || "";
    $("page").value = b.page || "home";
    $("displayType").value = b.display_type || "single";
    $("clickUrl").value = b.click_url || "";
    $("sortOrder").value = b.sort_order ?? 0;
    $("slideInterval").value = b.slide_interval || 5000;
    $("isActive").checked = !!b.is_active;
    $("startsAt").value = b.starts_at ? toLocalDateTime(b.starts_at) : "";
    $("endsAt").value = b.ends_at ? toLocalDateTime(b.ends_at) : "";
    $("mediaFile").required = false;

    $("filePreview").innerHTML = mediaMarkup(b.file_url,b.media_type);
    $("filePreview").style.display = "block";

    $("formTitle").textContent = "✎ ویرایش بنر";
    saveBtn.textContent = "ذخیره تغییرات";
    $("cancelBtn").classList.remove("hidden");
    $("editorPanel").scrollIntoView({behavior:"smooth"});
  }

  function toLocalDateTime(value) {
    const d = new Date(value);
    const local = new Date(d.getTime() - d.getTimezoneOffset()*60000);
    return local.toISOString().slice(0,16);
  }

  function getMediaType(file) {
    if(file.type === "image/gif") return "gif";
    if(file.type.startsWith("video/")) return "video";
    if(file.type.startsWith("image/")) return "image";
    return null;
  }

  $("mediaFile").addEventListener("change", () => {
    const file = $("mediaFile").files[0];
    if(previewObjectUrl) URL.revokeObjectURL(previewObjectUrl);
    previewObjectUrl = "";

    if(!file) return;

    const type = getMediaType(file);
    if(!type) {
      showMessage("فرمت فایل پشتیبانی نمی‌شود.","error");
      $("mediaFile").value = "";
      return;
    }

    if(file.size > 50*1024*1024) {
      showMessage("حجم فایل نباید بیشتر از ۵۰ مگابایت باشد.","error");
      $("mediaFile").value = "";
      return;
    }

    previewObjectUrl = URL.createObjectURL(file);
    const preview = $("filePreview");
    preview.innerHTML = mediaMarkup(previewObjectUrl,type);
    preview.style.display = "block";
  });

  async function uploadFile(file) {
    const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g,"-");
    const path = `${Date.now()}-${crypto.randomUUID()}-${safeName}`;

    const {error} = await supabase.storage
      .from("site-media")
      .upload(path,file,{upsert:false,contentType:file.type});

    if(error) throw error;

    const {data} = supabase.storage
      .from("site-media")
      .getPublicUrl(path);

    return data.publicUrl;
  }

  form.addEventListener("submit",async event => {
    event.preventDefault();

    const title = $("title").value.trim();
    const file = $("mediaFile").files[0];

    if(!title) {
      showMessage("عنوان بنر الزامی است.","error");
      return;
    }

    if(!editingId && !file) {
      showMessage("لطفاً یک فایل انتخاب کن.","error");
      return;
    }

    if(file && (!getMediaType(file) || file.size > 50*1024*1024)) {
      showMessage("فایل انتخاب‌شده معتبر نیست یا حجم آن بیش از ۵۰ مگابایت است.","error");
      return;
    }

    const startValue = $("startsAt").value;
    const endValue = $("endsAt").value;

    if(startValue && endValue && new Date(endValue) <= new Date(startValue)) {
      showMessage("زمان پایان باید بعد از زمان شروع باشد.","error");
      return;
    }

    saveBtn.disabled = true;
    saveBtn.textContent = "در حال ذخیره...";

    try {
      let fileUrl = existingFileUrl;
      let mediaType = banners.find(b => b.id === editingId)?.media_type || "image";

      if(file) {
        fileUrl = await uploadFile(file);
        mediaType = getMediaType(file);
      }

      const payload = {
        title,
        description: $("description").value.trim() || null,
        page: $("page").value,
        display_type: $("displayType").value,
        media_type: mediaType,
        file_url: fileUrl,
        click_url: $("clickUrl").value.trim() || null,
        sort_order: Number($("sortOrder").value) || 0,
        is_active: $("isActive").checked,
        starts_at: startValue ? new Date(startValue).toISOString() : null,
        ends_at: endValue ? new Date(endValue).toISOString() : null,
        slide_interval: Math.min(30000,Math.max(2000,Number($("slideInterval").value)||5000)),
        updated_at: new Date().toISOString()
      };

      let result;
      if(editingId) {
        result = await supabase.from("site_banners").update(payload).eq("id",editingId);
      } else {
        result = await supabase.from("site_banners").insert(payload);
      }

      if(result.error) throw result.error;

      showMessage(editingId ? "بنر با موفقیت ویرایش شد." : "بنر با موفقیت ثبت شد.");
      resetForm();
      await loadBanners();

    } catch(error) {
      showMessage("خطا در ذخیره: "+(error.message || "خطای نامشخص"),"error");
    } finally {
      saveBtn.disabled = false;
      saveBtn.textContent = editingId ? "ذخیره تغییرات" : "ذخیره بنر";
    }
  });

  list.addEventListener("click",async event => {
    const button = event.target.closest("button[data-action]");
    if(!button) return;

    const id = button.dataset.id;
    const action = button.dataset.action;
    const banner = banners.find(b => b.id === id);
    if(!banner) return;

    if(action === "edit") {
      editBanner(id);
      return;
    }

    if(action === "delete") {
      if(!confirm(`بنر «${banner.title}» حذف شود؟`)) return;

      const {error} = await supabase.from("site_banners").delete().eq("id",id);
      if(error) {
        showMessage("حذف ناموفق بود: "+error.message,"error");
        return;
      }

      showMessage("اطلاعات بنر حذف شد. فایل ذخیره‌شده در Storage باقی می‌ماند.");
      if(editingId === id) resetForm();
      await loadBanners();
    }

    if(action === "toggle") {
      const {error} = await supabase.from("site_banners")
        .update({is_active:!banner.is_active,updated_at:new Date().toISOString()})
        .eq("id",id);

      if(error) {
        showMessage("تغییر وضعیت ناموفق بود: "+error.message,"error");
        return;
      }

      showMessage(banner.is_active ? "بنر غیرفعال شد." : "بنر فعال شد.");
      await loadBanners();
    }
  });

  $("cancelBtn").addEventListener("click",resetForm);
  $("searchInput").addEventListener("input",renderBanners);

  const allowed = await checkAdmin();
  if(allowed) await loadBanners();
</script>
</body>
</html>
