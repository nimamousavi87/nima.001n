
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مدیریت پروژه‌ها | NIMA.001N</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Vazirmatn', sans-serif;
      background: #080808;
      color: #fff;
      min-height: 100vh;
      padding: 25px;
      background-image:
        radial-gradient(circle at 10% 10%, #3d080822, transparent 35%),
        radial-gradient(circle at 90% 90%, #65000022, transparent 35%);
    }

    .container {
      width: 100%;
      max-width: 1100px;
      margin: auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 30px;
    }

    .brand {
      font-size: 23px;
      font-weight: 800;
    }

    .brand span {
      color: #ff3030;
    }

    .back {
      color: #fff;
      text-decoration: none;
      border: 1px solid #ffffff20;
      padding: 10px 16px;
      border-radius: 12px;
      background: #ffffff08;
    }

    h1 {
      font-size: 25px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #999;
      font-size: 13px;
      margin-bottom: 25px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .stat, .panel {
      background: #111;
      border: 1px solid #ffffff12;
      border-radius: 18px;
      padding: 20px;
    }

    .stat small {
      color: #999;
    }

    .stat strong {
      display: block;
      font-size: 26px;
      margin-top: 8px;
      color: #ff3939;
    }

    .panel {
      margin-bottom: 22px;
    }

    .panel h2 {
      font-size: 18px;
      margin-bottom: 20px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      color: #bbb;
      font-size: 13px;
    }

    input, textarea, select {
      width: 100%;
      background: #080808;
      color: #fff;
      border: 1px solid #292929;
      border-radius: 11px;
      padding: 13px;
      outline: none;
      font-family: inherit;
    }

    input:focus, textarea:focus, select:focus {
      border-color: #ff3030;
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    .checks {
      display: flex;
      gap: 22px;
      flex-wrap: wrap;
      margin-top: 18px;
      color: #ccc;
      font-size: 13px;
    }

    .checks label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .checks input {
      width: auto;
      accent-color: #ff3030;
    }

    button {
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-weight: 700;
      border-radius: 11px;
      padding: 12px 18px;
    }

    .save {
      background: #ff3030;
      color: white;
      margin-top: 20px;
    }

    .cancel {
      background: #292929;
      color: white;
      margin-right: 8px;
    }

    .projects {
      display: grid;
      gap: 12px;
    }

    .project {
      background: #0b0b0b;
      border: 1px solid #ffffff12;
      border-radius: 14px;
      padding: 17px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .project h3 {
      font-size: 16px;
      margin-bottom: 7px;
    }

    .project p {
      color: #999;
      font-size: 12px;
    }

    .status {
      display: inline-block;
      margin-top: 8px;
      font-size: 11px;
      color: #ff7777;
    }

    .actions {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }

    .actions button {
      font-size: 12px;
      padding: 9px 12px;
      background: #222;
      color: #fff;
    }

    .actions .delete {
      background: #4b1111;
      color: #ff7777;
    }

    .empty {
      color: #888;
      text-align: center;
      padding: 25px;
    }

    #message {
      display: none;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 15px;
      font-size: 13px;
      background: #222;
    }

    @media (max-width: 650px) {
      body {
        padding: 15px;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <header>
      <div class="brand">NIMA<span>.001N</span></div>
      <a class="back" href="index.html">بازگشت به پنل ←</a>
    </header>

    <h1>مدیریت پروژه‌ها</h1>
    <p class="subtitle">افزودن، ویرایش، حذف و انتشار پروژه‌های وب‌سایت</p>

    <div id="message"></div>

    <section class="stats">
      <div class="stat">
        <small>کل پروژه‌ها</small>
        <strong id="totalCount">۰</strong>
      </div>
      <div class="stat">
        <small>منتشر شده</small>
        <strong id="publishedCount">۰</strong>
      </div>
      <div class="stat">
        <small>پیش‌نویس</small>
        <strong id="draftCount">۰</strong>
      </div>
    </section>

    <section class="panel">
      <h2 id="formTitle">افزودن پروژه جدید</h2>

      <form id="projectForm">
        <input type="hidden" id="projectId">

        <div class="form-grid">

          <div class="field">
            <label for="title">نام پروژه</label>
            <input id="title" required placeholder="مثلاً Poolyar">
          </div>

          <div class="field">
            <label for="slug">شناسه انگلیسی پروژه</label>
            <input id="slug" required placeholder="poolyar">
          </div>

          <div class="field">
            <label for="category">دسته‌بندی</label>
            <input id="category" placeholder="اپلیکیشن">
          </div>

          <div class="field">
            <label for="project_url">لینک پروژه</label>
            <input id="project_url" type="url" placeholder="https://example.com">
          </div>

          <div class="field full">
            <label for="image_url">لینک تصویر پروژه</label>
            <input id="image_url" type="url" placeholder="https://example.com/image.jpg">
          </div>

          <div class="field">
            <label for="sort_order">ترتیب نمایش</label>
            <input id="sort_order" type="number" value="0">
          </div>

          <div class="field full">
            <label for="description">توضیحات پروژه</label>
            <textarea id="description" placeholder="توضیحات کوتاه پروژه..."></textarea>
          </div>

        </div>

        <div class="checks">
          <label>
            <input type="checkbox" id="is_featured">
            پروژه ویژه
          </label>

          <label>
            <input type="checkbox" id="is_published">
            انتشار در سایت
          </label>
        </div>

        <button class="save" type="submit" id="saveButton">
          ذخیره پروژه
        </button>

        <button class="cancel" type="button" id="cancelButton" hidden>
          لغو ویرایش
        </button>
      </form>
    </section>

    <section class="panel">
      <h2>فهرست پروژه‌ها</h2>
      <div class="projects" id="projectsList">
        <div class="empty">در حال دریافت پروژه‌ها...</div>
      </div>
    </section>

  </div>

  <script type="module">
    import { supabase } from "./supabase.js";

    const $ = (id) => document.getElementById(id);

    const form = $("projectForm");
    const list = $("projectsList");
    const message = $("message");

    let currentUser = null;

    function showMessage(text, error = false) {
      message.textContent = text;
      message.style.display = "block";
      message.style.color = error ? "#ff7777" : "#8dffb0";

      setTimeout(() => {
        message.style.display = "none";
      }, 4000);
    }

    async function checkAdmin() {
      const { data: sessionData, error: sessionError } =
        await supabase.auth.getSession();

      if (sessionError || !sessionData.session) {
        location.href = "index.html";
        return false;
      }

      currentUser = sessionData.session.user;

      const { data, error } = await supabase
        .from("admin_users")
        .select("user_id")
        .eq("user_id", currentUser.id)
        .maybeSingle();

      if (error || !data) {
        showMessage("دسترسی مدیریت تأیید نشد.", true);
        return false;
      }

      return true;
    }

    async function loadProjects() {
      const { data, error } = await supabase
        .from("projects")
        .select("*")
        .order("sort_order", { ascending: true })
        .order("created_at", { ascending: false });

      if (error) {
        list.innerHTML = '<div class="empty">خطا در دریافت پروژه‌ها</div>';
        showMessage(error.message, true);
        return;
      }

      const projects = data || [];

      $("totalCount").textContent = projects.length;
      $("publishedCount").textContent =
        projects.filter(p => p.is_published).length;
      $("draftCount").textContent =
        projects.filter(p => !p.is_published).length;

      if (!projects.length) {
        list.innerHTML = '<div class="empty">هنوز پروژه‌ای ثبت نشده است.</div>';
        return;
      }

      list.innerHTML = projects.map(project => `
        <article class="project">
          <div>
            <h3>${escapeHTML(project.title)}</h3>
            <p>${escapeHTML(project.category || "عمومی")} · ${escapeHTML(project.slug)}</p>
            <span class="status">
              ${project.is_published ? "منتشر شده" : "پیش‌نویس"}
              ${project.is_featured ? " · ویژه" : ""}
            </span>
          </div>

          <div class="actions">
            <button data-edit="${project.id}">ویرایش</button>
            <button data-toggle="${project.id}">
              ${project.is_published ? "لغو انتشار" : "انتشار"}
            </button>
            <button class="delete" data-delete="${project.id}">حذف</button>
          </div>
        </article>
      `).join("");

      list.querySelectorAll("[data-edit]").forEach(button => {
        button.addEventListener("click", () => {
          const project = projects.find(p => p.id === button.dataset.edit);
          if (project) fillForm(project);
        });
      });

      list.querySelectorAll("[data-toggle]").forEach(button => {
        button.addEventListener("click", () => {
          togglePublish(button.dataset.toggle, projects);
        });
      });

      list.querySelectorAll("[data-delete]").forEach(button => {
        button.addEventListener("click", () => {
          deleteProject(button.dataset.delete);
        });
      });
    }

    function escapeHTML(value = "") {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      })[char]);
    }

    function fillForm(project) {
      $("projectId").value = project.id;
      $("title").value = project.title || "";
      $("slug").value = project.slug || "";
      $("category").value = project.category || "";
      $("project_url").value = project.project_url || "";
      $("image_url").value = project.image_url || "";
      $("description").value = project.description || "";
      $("sort_order").value = project.sort_order ?? 0;
      $("is_featured").checked = !!project.is_featured;
      $("is_published").checked = !!project.is_published;

      $("formTitle").textContent = "ویرایش پروژه";
      $("saveButton").textContent = "ذخیره تغییرات";
      $("cancelButton").hidden = false;

      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function resetForm() {
      form.reset();
      $("projectId").value = "";
      $("sort_order").value = 0;
      $("formTitle").textContent = "افزودن پروژه جدید";
      $("saveButton").textContent = "ذخیره پروژه";
      $("cancelButton").hidden = true;
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();

      const id = $("projectId").value;

      const project = {
        title: $("title").value.trim(),
        slug: $("slug").value.trim(),
        category: $("category").value.trim() || "عمومی",
        project_url: $("project_url").value.trim(),
        image_url: $("image_url").value.trim(),
        description: $("description").value.trim(),
        sort_order: Number($("sort_order").value) || 0,
        is_featured: $("is_featured").checked,
        is_published: $("is_published").checked,
        updated_at: new Date().toISOString()
      };

      if (!project.title || !project.slug) {
        showMessage("نام و شناسه پروژه الزامی است.", true);
        return;
      }

      $("saveButton").disabled = true;

      const result = id
        ? await supabase.from("projects").update(project).eq("id", id)
        : await supabase.from("projects").insert(project);

      $("saveButton").disabled = false;

      if (result.error) {
        showMessage("خطا: " + result.error.message, true);
        return;
      }

      showMessage(id ? "پروژه ویرایش شد." : "پروژه ثبت شد.");
      resetForm();
      await loadProjects();
    });

    async function togglePublish(id, projects) {
      const project = projects.find(p => p.id === id);
      if (!project) return;

      const { error } = await supabase
        .from("projects")
        .update({
          is_published: !project.is_published,
          updated_at: new Date().toISOString()
        })
        .eq("id", id);

      if (error) {
        showMessage(error.message, true);
        return;
      }

      showMessage("وضعیت انتشار تغییر کرد.");
      await loadProjects();
    }

    async function deleteProject(id) {
      if (!confirm("از حذف این پروژه مطمئن هستی؟")) return;

      const { error } = await supabase
        .from("projects")
        .delete()
        .eq("id", id);

      if (error) {
        showMessage(error.message, true);
        return;
      }

      showMessage("پروژه حذف شد.");
      resetForm();
      await loadProjects();
    }

    $("cancelButton").addEventListener("click", resetForm);

    if (await checkAdmin()) {
      await loadProjects();
    }
  </script>
</body>
</html>
