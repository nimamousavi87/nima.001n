
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <title>ارتباط با من | NIMA.001N</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --red: #ff1744;
      --red-light: #ff4267;
      --bg: #070707;
      --card: rgba(255,255,255,.035);
      --border: rgba(255,255,255,.09);
      --muted: #929292;
    }

    body {
      min-height: 100vh;
      color: #fff;
      background:
        radial-gradient(ellipse at 50% 38%, rgba(255,23,68,.11), transparent 38%),
        radial-gradient(circle at 10% 85%, rgba(255,23,68,.055), transparent 25%),
        var(--bg);
      font-family: "Vazirmatn", sans-serif;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .18;
      background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 45px 45px;
      mask-image: linear-gradient(to bottom, black, transparent 90%);
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* HEADER */

    .main-header {
      height: 82px;
      padding: 0 7%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,.07);
      background: rgba(8,8,8,.78);
      backdrop-filter: blur(18px);
      position: relative;
      z-index: 20;
    }

    .logo {
      font-family: "Space Grotesk", sans-serif;
      font-size: 25px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .logo span {
      color: var(--red);
      text-shadow: 0 0 18px #ff174477;
    }

    .desktop-nav {
      display: flex;
      align-items: center;
      gap: 30px;
    }

    .desktop-nav a {
      color: #aaa;
      font-size: 13px;
      font-weight: 500;
      transition: .3s;
    }

    .desktop-nav a:hover,
    .desktop-nav a.active {
      color: var(--red-light);
    }

    .menu-toggle {
      display: none;
      border: 0;
      background: none;
      color: white;
      font-size: 27px;
      cursor: pointer;
    }

    /* MAIN */

    .contact-section {
      min-height: calc(100vh - 150px);
      padding: 90px 20px 100px;
      display: flex;
      align-items: center;
      flex-direction: column;
      position: relative;
      z-index: 1;
    }

    .top-label {
      display: flex;
      align-items: center;
      gap: 9px;
      color: #ff718c;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 3px;
      font-family: "Space Grotesk", sans-serif;
      margin-bottom: 22px;
    }

    .top-label::before,
    .top-label::after {
      content: "";
      width: 22px;
      height: 1px;
      background: var(--red);
      box-shadow: 0 0 10px var(--red);
    }

    .section-title {
      font-size: clamp(30px, 5vw, 45px);
      font-weight: 800;
      text-align: center;
      letter-spacing: -1px;
    }

    .section-title span {
      color: var(--red);
      text-shadow: 0 0 28px #ff174466;
    }

    .title-line {
      width: 70px;
      height: 3px;
      border-radius: 10px;
      margin: 24px 0 48px;
      background: linear-gradient(90deg, transparent, var(--red), transparent);
      box-shadow: 0 0 18px #ff1744;
    }

    /* SOCIAL CARDS */

    .contact-list {
      width: 100%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      gap: 17px;
    }

    .contact-card {
      position: relative;
      display: flex;
      align-items: center;
      gap: 19px;
      padding: 21px 23px;
      min-height: 96px;
      border: 1px solid var(--border);
      border-radius: 19px;
      background: linear-gradient(
        125deg,
        rgba(255,255,255,.065),
        rgba(255,255,255,.018)
      );
      backdrop-filter: blur(15px);
      overflow: hidden;
      transition: transform .35s, border-color .35s, box-shadow .35s;
      animation: appear .7s both;
    }

    .contact-card:nth-child(2) {
      animation-delay: .12s;
    }

    .contact-card:nth-child(3) {
      animation-delay: .24s;
    }

    .contact-card::before {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      width: 3px;
      height: 100%;
      background: var(--red);
      opacity: .65;
      transition: .3s;
    }

    .contact-card::after {
      content: "";
      position: absolute;
      width: 150px;
      height: 150px;
      left: -100px;
      top: -75px;
      border-radius: 50%;
      background: rgba(255,23,68,.08);
      filter: blur(35px);
      opacity: 0;
      transition: .4s;
    }

    .contact-card:hover {
      transform: translateY(-5px);
      border-color: rgba(255,23,68,.55);
      box-shadow: 0 15px 40px rgba(255,23,68,.09);
    }

    .contact-card:hover::before {
      opacity: 1;
      box-shadow: 0 0 15px var(--red);
    }

    .contact-card:hover::after {
      opacity: 1;
    }

    .app-icon {
      width: 57px;
      height: 57px;
      min-width: 57px;
      border-radius: 17px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(255,255,255,.055);
      border: 1px solid rgba(255,255,255,.08);
      position: relative;
      z-index: 1;
      transition: .35s;
    }

    .app-icon svg {
      width: 29px;
      height: 29px;
      display: block;
    }

    .contact-card:hover .app-icon {
      transform: scale(1.08) rotate(-5deg);
      background: rgba(255,23,68,.1);
      border-color: rgba(255,23,68,.35);
    }

    .instagram .app-icon {
      color: #ff4d83;
    }

    .telegram .app-icon {
      color: #36bafa;
    }

    .github .app-icon {
      color: #fff;
    }

    .contact-info {
      flex: 1;
      min-width: 0;
      position: relative;
      z-index: 1;
    }

    .contact-info h3 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .contact-info p {
      color: var(--muted);
      font-size: 12px;
      font-family: "Space Grotesk", sans-serif;
      direction: ltr;
      text-align: right;
      letter-spacing: .3px;
    }

    .contact-arrow {
      color: #777;
      font-size: 23px;
      position: relative;
      z-index: 1;
      transition: .3s;
    }

    .contact-card:hover .contact-arrow {
      color: var(--red);
      transform: translateX(-5px);
    }

    /* FOOTER */

    footer {
      padding: 24px 15px;
      text-align: center;
      border-top: 1px solid rgba(255,255,255,.07);
      color: #666;
      font-size: 11px;
      font-family: "Space Grotesk", sans-serif;
      letter-spacing: 1px;
    }

    footer span {
      color: var(--red);
    }

    /* MOBILE MENU */

    .menu-overlay {
      display: none;
    }

    .mobile-menu {
      display: none;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 900px) {
      .main-header {
        height: 72px;
      }

      .desktop-nav {
        display: none;
      }

      .menu-toggle {
        display: block;
      }

      .mobile-menu {
        display: flex;
        position: fixed;
        top: 0;
        right: -290px;
        width: 270px;
        height: 100vh;
        z-index: 1001;
        background: #101010;
        border-left: 1px solid #333;
        padding: 25px;
        flex-direction: column;
        gap: 25px;
        transition: right .3s ease;
      }

      body.menu-open .mobile-menu {
        right: 0;
      }

      .menu-close {
        align-self: flex-end;
        background: none;
        border: 0;
        color: #fff;
        font-size: 28px;
        cursor: pointer;
      }

      .mobile-menu nav {
        display: flex;
        flex-direction: column;
        gap: 25px;
      }

      .mobile-menu nav a {
        color: #ccc;
        font-size: 14px;
      }

      .mobile-menu nav a.active,
      .mobile-menu nav a:hover {
        color: var(--red);
      }

      .menu-overlay {
        display: block;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,.75);
        z-index: 1000;
        opacity: 0;
        visibility: hidden;
        transition: .3s;
      }

      body.menu-open .menu-overlay {
        opacity: 1;
        visibility: visible;
      }
    }

    @media (max-width: 480px) {
      .contact-section {
        padding: 75px 18px 85px;
      }

      .title-line {
        margin-bottom: 38px;
      }

      .contact-card {
        min-height: 88px;
        padding: 16px;
        gap: 14px;
        border-radius: 16px;
      }

      .app-icon {
        width: 51px;
        height: 51px;
        min-width: 51px;
        border-radius: 15px;
      }

      .app-icon svg {
        width: 26px;
        height: 26px;
      }

      .contact-info h3 {
        font-size: 15px;
      }

      .contact-info p {
        font-size: 11px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

  <script>
    const menuToggle = document.getElementById("menuToggle");
    const menuClose = document.getElementById("menuClose");
    const mobileMenu = document.getElementById("mobileMenu");
    const menuOverlay = document.getElementById("menuOverlay");

    function openMenu() {
      document.body.classList.add("menu-open");
      menuToggle.setAttribute("aria-expanded", "true");
    }

    function closeMenu() {
      document.body.classList.remove("menu-open");
      menuToggle.setAttribute("aria-expanded", "false");
    }

    menuToggle.addEventListener("click", openMenu);
    menuClose.addEventListener("click", closeMenu);
    menuOverlay.addEventListener("click", closeMenu);

    document.addEventListener("keydown", function(event) {
      if (event.key === "Escape") closeMenu();
    });

    mobileMenu.querySelectorAll("nav a").forEach(function(link) {
      link.addEventListener("click", closeMenu);
    });

    window.addEventListener("resize", function() {
      if (window.innerWidth > 900) closeMenu();
    });
  </script>
